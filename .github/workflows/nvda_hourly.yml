name: NVIDIA (NVDA)

on:
  schedule:
    - cron: "0 * * * *"   # ส่งทุกชั่วโมงตรง
  workflow_dispatch:       # รองรับ manual run

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - uses: actions/checkout@v3

    # Setup Python
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # ติดตั้ง dependencies
    - name: Install dependencies
      run: |
        pip install yfinance pytz requests

    # รัน Python script
    - name: Run NVDA notify
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python nvda_notify.py
