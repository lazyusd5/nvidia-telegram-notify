name: Nvidia Alert

on:
  schedule:
    - cron: '*/6 13-21 * * 1-5'  # ทุก 6 นาที ช่วง 9:30-16:00 EST (UTC+0 = 13:30-21:00)
  workflow_dispatch:  # กด run เองก็ได้

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance requests pytz
      - name: Run NVDA alert script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nvda_alert.py
