name: NVDA Price Notifier

on:
  schedule:
    - cron: "*/6 * * * *"       # รันทุก 6 นาที
  workflow_dispatch:             # Manual run

jobs:
  run-nvda-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pytz

      - name: Run NVDA Notify Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_NVDA: ${{ secrets.CHAT_ID_NVDA }}
          VOL_THRESHOLD: ${{ secrets.VOL_THRESHOLD }}
          FORCE_RUN: ${{ secrets.FORCE_RUN }}
        run: |
          python nvda_notify.py
